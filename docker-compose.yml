version: '3.8'

networks:
  resume-network:
    driver: bridge

services:
  tika:
    image: apache/tika:latest
    container_name: tika_server
    restart: always
    ports:
      - "9998:9998"
    networks:
      - resume-network

  app:
    build: .
    container_name: resume_reviewer_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - TIKA_URL=http://tika_server:9998  # Override for Docker network
    depends_on:
      - tika
    networks:
      - resume-network