version: '3.8'

networks:
  resume-network:
    driver: bridge

services:
  tika:
    image: apache/tika:latest
    container_name: tika_server
    restart: always
    ports:
      - "9998:9998"
    networks:
      - resume-network

  latex:
    image: texlive/texlive:latest
    container_name: latex_compiler
    restart: always
    volumes:
      - ./storage:/workdir
    command: ["tail", "-f", "/dev/null"]  # Keep container running
    networks:
      - resume-network

  app:
    build: .
    container_name: resume_reviewer_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - TIKA_URL=http://tika_server:9998  # Override for Docker network
      - LATEX_SERVICE_URL=latex_compiler  # LaTeX service container name
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
    depends_on:
      - tika
      - latex
    networks:
      - resume-network